<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoEat – Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/nes.css@2.3.0/css/nes.min.css" />
  <link rel="stylesheet" href="/static/style.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #2b2d42;
      --surface:   #363858;
      --header-bg: #1e2035;
      --border:    #5a5e7e;
      --mint:      #7ecfb3;
      --coral:     #e8957a;
      --amber:     #f0c87a;
      --rose:      #c47878;
      --dim:       #7a7e9e;
      --text:      #d4d6f0;
    }

    body {
      font-family: 'Press Start 2P', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
    }

    /* ── terminal frame ── */
    .terminal {
      width: 100%;
      max-width: 440px;
      box-shadow:
        8px 8px 0 rgba(0,0,0,0.4),
        0 0 28px rgba(233,69,96,0.32);
      padding: 28px 26px 30px;
    }

    .terminal-header { text-align: center; margin-bottom: 22px; }
    .subtitle {
      font-size: 11px;
      color: var(--mint);
      margin-top: 12px;
      letter-spacing: 3px;
    }

    .divider {
      border: none;
      border-top: 2px dashed var(--border);
      margin: 24px 0;
    }

    /* ── role tiles ── */
    .role-group {
      display: flex;
      gap: 12px;
      margin-bottom: 28px;
    }
    .role-tile {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 6px;
      border: 3px solid var(--border);
      color: var(--dim);
      font-size: 0.4rem;
      letter-spacing: 1px;
      cursor: pointer;
      user-select: none;
      transition: border-color 0.1s, color 0.1s;
    }
    .role-tile input[type="radio"] { display: none; }
    .role-tile.active {
      border-color: var(--mint);
      color: var(--mint);
      background: rgba(126,207,179,0.08);
    }
    .role-tile:not(.active):hover {
      border-color: var(--border);
      color: var(--text);
    }

    /* ── fields ── */
    .field { margin-bottom: 14px; }
    .field-label {
      display: block;
      font-size: 11px;
      color: var(--mint);
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    /* full-width primary submit */
    #btn-login {
      width: 100%;
      margin-top: 10px;
    }

    /* ── error panel ── */
    .error-panel {
      display: none;
      margin-top: 18px;
      border: 3px solid var(--rose);
      padding: 12px 14px;
      background: var(--header-bg);
      font-size: 11px;
      color: var(--rose);
      line-height: 1.8;
      letter-spacing: 1px;
      animation: slide-in 0.15s ease;
    }
    @keyframes slide-in {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── footer link ── */
    .footer-link {
      text-align: center;
      margin-top: 22px;
      font-size: 11px;
      color: var(--dim);
      line-height: 2;
      letter-spacing: 1px;
    }
    .footer-link a {
      color: var(--amber);
      text-decoration: none;
      border-bottom: 1px solid var(--amber);
    }
    .footer-link a:hover { opacity: 0.75; }

    @keyframes blink { 50% { opacity: 0; } }
    .cursor-blink { animation: blink 1s step-end infinite; color: var(--mint); }
  </style>
</head>
<body>
  <div class="crt-overlay"></div>

  <div class="terminal nes-container is-dark with-title is-centered">
    <p class="title">LOGIN.EXE</p>
    <div class="terminal-header">
      <h1 class="logo neon-title">ECOEAT</h1>
      <div class="subtitle">LOGIN TERMINAL</div>
    </div>

    <div style="font-size:10px; color:var(--dim); margin-bottom:14px; letter-spacing:1px;">
      C:\ECOEAT&gt; AUTH.EXE<span class="cursor-blink">█</span>
    </div>
    <hr class="divider" />

    <!-- Role selector -->
    <div style="font-size:11px; color:var(--mint); letter-spacing:2px; margin-bottom:10px;">SELECT ROLE:</div>
    <div class="role-group" id="role-group">
      <label class="role-tile active" id="tile-student">
        <input type="radio" name="role" value="student" checked />
        STUDENT
      </label>
      <label class="role-tile" id="tile-store">
        <input type="radio" name="role" value="store" />
        VENDOR
      </label>
    </div>

    <div class="field">
      <label class="field-label" for="email">EMAIL:</label>
      <input class="nes-input is-dark" id="email" type="email" placeholder="user@campus.edu" autocomplete="email" />
    </div>

    <div class="field">
      <label class="field-label" for="password">PASSWORD:</label>
      <input class="nes-input is-dark" id="password" type="password" placeholder="********" autocomplete="current-password" />
    </div>

    <button type="button" class="nes-btn is-primary" id="btn-login">LOGIN</button>

    <div class="error-panel" id="error-panel"></div>

    <div class="footer-link">
      NO ACCOUNT? <a href="/signup">[ REGISTER HERE ]</a>
    </div>
  </div>

<script>
  const tileStudent = document.getElementById('tile-student');
  const tileStore   = document.getElementById('tile-store');
  const btnLogin    = document.getElementById('btn-login');
  const errorPanel  = document.getElementById('error-panel');

  function setRole(role) {
    tileStudent.classList.toggle('active', role === 'student');
    tileStore.classList.toggle('active', role === 'store');
    tileStudent.querySelector('input').checked = role === 'student';
    tileStore.querySelector('input').checked   = role === 'store';
    errorPanel.style.display = 'none';
  }

  tileStudent.addEventListener('click', () => setRole('student'));
  tileStore.addEventListener('click',   () => setRole('store'));

  function getRole() {
    return document.querySelector('input[name="role"]:checked').value;
  }

  function showError(msg) {
    errorPanel.textContent = `[!] ${msg}`;
    errorPanel.style.display = 'block';
  }

  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') btnLogin.click();
  });

  btnLogin.addEventListener('click', async () => {
    const role     = getRole();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (!email || !password) {
      showError('Email and password are required.');
      return;
    }

    btnLogin.disabled     = true;
    btnLogin.textContent  = 'AUTHENTICATING...';
    errorPanel.style.display = 'none';

    try {
      const res  = await fetch('/api/login', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ role, email, password }),
      });
      const data = await res.json();

      if (res.ok) {
        window.location.href = role === 'student' ? '/' : '/vendor';
      } else {
        showError(data.error || 'Login failed.');
      }
    } catch (err) {
      showError('Network error. Try again.');
    } finally {
      btnLogin.disabled    = false;
      btnLogin.textContent = 'LOGIN';
    }
  });
</script>
</body>
</html>
