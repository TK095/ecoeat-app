<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoEat – Blind Box Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/nes.css@2.3.0/css/nes.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #2b2d42;
      --surface:   #363858;
      --header-bg: #1e2035;
      --border:    #5a5e7e;
      --mint:      #7ecfb3;
      --coral:     #e8957a;
      --amber:     #f0c87a;
      --rose:      #c47878;
      --dim:       #7a7e9e;
      --text:      #d4d6f0;
    }

    body {
      font-family: 'Press Start 2P', monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 0 0 60px;
    }

    /* ── header ── */
    header {
      background: var(--header-bg);
      border-bottom: 4px solid var(--border);
      padding: 24px 16px 20px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 3px 12px rgba(0,0,0,0.35);
    }
    header h1 {
      font-size: clamp(1.1rem, 4vw, 2rem);
      color: var(--mint);
      letter-spacing: 4px;
    }
    header p {
      font-size: 0.45rem;
      color: var(--dim);
      margin-top: 10px;
      letter-spacing: 2px;
    }

    /* ── header nav links ── */
    .header-nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 14px;
    }
    .vendor-link, .dashboard-link {
      display: inline-block;
      font-size: 0.42rem;
      text-decoration: none;
      border-bottom: 2px solid;
    }
    .vendor-link    { color: var(--coral); border-color: var(--coral); }
    .dashboard-link { color: var(--amber); border-color: var(--amber); }
    .vendor-link:hover, .dashboard-link:hover { opacity: 0.75; }

    /* ── user bar ── */
    .user-bar {
      display: none;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 14px;
      font-size: 0.38rem;
      color: var(--text);
    }
    .user-bar .user-name { color: var(--mint); }
    .user-bar .user-balance { color: var(--amber); }
    .btn-logout {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.34rem;
      background: transparent;
      color: var(--rose);
      border: 2px solid var(--rose);
      padding: 5px 10px;
      cursor: pointer;
      letter-spacing: 1px;
    }
    .btn-logout:hover { background: var(--rose); color: var(--header-bg); }

    /* ── main grid ── */
    main {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 16px;
    }

    /* ── leaderboard ── */
    .leaderboard-wrap {
      max-width: 1100px;
      margin: 36px auto 0;
      padding: 0 16px;
    }
    .leaderboard-panel {
      background: var(--surface);
      border: 3px solid var(--border);
      box-shadow: 6px 6px 0 rgba(0,0,0,0.28);
      padding: 24px 28px 28px;
    }
    .lb-title {
      font-size: 0.55rem;
      color: var(--amber);
      letter-spacing: 3px;
      margin-bottom: 20px;
      border-left: 4px solid var(--amber);
      padding-left: 12px;
    }
    .lb-list { list-style: none; }
    .lb-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      animation: slide-in 0.15s ease both;
    }
    .lb-row:last-child { border-bottom: none; }
    @keyframes slide-in {
      from { opacity: 0; transform: translateX(-8px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .lb-row:nth-child(1) { animation-delay: 0.05s; }
    .lb-row:nth-child(2) { animation-delay: 0.10s; }
    .lb-row:nth-child(3) { animation-delay: 0.15s; }
    .lb-row:nth-child(4) { animation-delay: 0.20s; }
    .lb-row:nth-child(5) { animation-delay: 0.25s; }

    .lb-rank {
      font-size: 0.6rem;
      min-width: 32px;
      text-align: center;
    }
    .lb-rank-1 { color: var(--amber); }
    .lb-rank-2 { color: #c0c0c0; }
    .lb-rank-3 { color: #cd7f32; }
    .lb-rank-n { color: var(--dim); }

    .lb-name  { flex: 1; font-size: 0.42rem; color: var(--text); }
    .lb-score {
      font-size: 0.5rem;
      color: var(--mint);
      letter-spacing: 2px;
      white-space: nowrap;
    }
    .lb-score::after { content: ' PTS'; font-size: 0.3rem; color: var(--dim); }
    .lb-empty {
      font-size: 0.4rem;
      color: var(--dim);
      text-align: center;
      padding: 20px 0;
    }

    .section-title {
      font-size: 0.6rem;
      color: var(--coral);
      letter-spacing: 3px;
      margin-bottom: 24px;
      border-left: 4px solid var(--coral);
      padding-left: 12px;
    }

    #box-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    /* ── individual card ── */
    .box-card {
      background: var(--surface);
      border: 3px solid var(--border);
      padding: 20px 18px 18px;
      position: relative;
      image-rendering: pixelated;
      box-shadow: 4px 4px 0 rgba(0,0,0,0.3);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .box-card:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 rgba(0,0,0,0.35);
    }

    .card-store {
      font-size: 0.4rem;
      color: var(--coral);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    .card-name {
      font-size: 0.55rem;
      color: var(--mint);
      line-height: 1.6;
      margin-bottom: 14px;
    }

    .card-prices {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    .price-original {
      font-size: 0.45rem;
      color: var(--dim);
      text-decoration: line-through;
    }
    .price-flash {
      font-size: 0.75rem;
      color: var(--amber);
    }

    .card-meta {
      font-size: 0.38rem;
      color: var(--dim);
      margin-bottom: 16px;
      line-height: 2;
    }
    .card-meta span { color: var(--text); }

    .stock-badge {
      display: inline-block;
      font-size: 0.38rem;
      padding: 3px 8px;
      border: 2px solid var(--mint);
      color: var(--mint);
      margin-bottom: 16px;
    }

    .btn-reserve {
      width: 100%;
      font-family: 'Press Start 2P', monospace;
      font-size: 0.5rem;
      background: var(--coral);
      color: #1e2035;
      border: none;
      padding: 10px 0;
      cursor: pointer;
      letter-spacing: 2px;
      box-shadow: 4px 4px 0 #7a3a28;
      transition: transform 0.08s, box-shadow 0.08s;
    }
    .btn-reserve:hover  { background: #edaa92; }
    .btn-reserve:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 #7a3a28; }
    .btn-reserve:disabled {
      background: var(--border);
      color: var(--dim);
      cursor: not-allowed;
      box-shadow: none;
    }

    /* ── loading / empty ── */
    #status-msg {
      text-align: center;
      font-size: 0.5rem;
      color: var(--dim);
      margin-top: 60px;
      line-height: 2.5;
    }
    #status-msg .blink {
      animation: blink 1s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* ── modal overlay ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(27,29,50,0.88);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }

    .modal-box {
      background: var(--header-bg);
      border: 3px solid var(--mint);
      padding: 32px 28px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 8px 8px 0 rgba(0,0,0,0.35);
      animation: pop-in 0.15s ease;
    }
    .modal-box.error {
      border-color: var(--rose);
    }
    @keyframes pop-in {
      from { transform: scale(0.85); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }

    .modal-icon { font-size: 2rem; margin-bottom: 16px; }
    .modal-title {
      font-size: 0.65rem;
      color: var(--mint);
      margin-bottom: 18px;
      letter-spacing: 2px;
    }
    .modal-box.error .modal-title {
      color: var(--rose);
    }

    .pickup-code {
      display: inline-block;
      font-size: 1.4rem;
      color: var(--amber);
      letter-spacing: 8px;
      border: 3px dashed var(--amber);
      padding: 12px 20px;
      margin: 12px 0 20px;
    }

    .modal-msg {
      font-size: 0.4rem;
      color: var(--dim);
      line-height: 2;
      margin-bottom: 20px;
    }

    .btn-close {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.45rem;
      background: transparent;
      color: var(--text);
      border: 3px solid var(--border);
      padding: 8px 20px;
      cursor: pointer;
      letter-spacing: 2px;
    }
    .btn-close:hover { background: var(--border); color: var(--header-bg); }
  </style>
</head>
<body>

  <header>
    <h1>🌿 ECOEAT</h1>
    <p>CAMPUS SURPLUS FOOD RESCUE PLATFORM</p>
    <div class="user-bar" id="user-bar">
      <span class="user-name" id="user-name"></span>
      <span class="user-balance" id="user-balance"></span>
      <button class="btn-logout" id="btn-logout">[ LOGOUT ]</button>
    </div>
    <div class="header-nav">
      <a class="dashboard-link" href="/student_dashboard">▶ MY PROFILE &amp; ORDERS</a>
      <a class="vendor-link"    href="/vendor">▶ VENDOR PORTAL</a>
    </div>
  </header>

  <!-- Leaderboard -->
  <div class="leaderboard-wrap">
    <div class="leaderboard-panel">
      <div class="lb-title">🏆 TOP RESCUERS (HIGH SCORES)</div>
      <ul class="lb-list" id="lb-list">
        <li class="lb-empty blink">▓▓▓ LOADING... ▓▓▓</li>
      </ul>
    </div>
  </div>

  <main>
    <p class="section-title">// AVAILABLE BLIND BOXES</p>
    <div id="box-grid"></div>
    <div id="status-msg">
      <p class="blink">▓▓▓ LOADING BOXES... ▓▓▓</p>
    </div>
  </main>

  <!-- Modal -->
  <div class="modal-overlay" id="modal" role="dialog" aria-modal="true">
    <div class="modal-box" id="modal-box">
      <div class="modal-icon" id="modal-icon"></div>
      <div class="modal-title" id="modal-title"></div>
      <div id="modal-code-wrap" style="display:none">
        <div class="pickup-code" id="modal-code"></div>
      </div>
      <div class="modal-msg" id="modal-msg"></div>
      <button class="btn-close" id="modal-close">[ OK ]</button>
    </div>
  </div>

<script>
  const grid      = document.getElementById('box-grid');
  const statusMsg = document.getElementById('status-msg');
  const modal     = document.getElementById('modal');
  const modalBox  = document.getElementById('modal-box');

  // ── Auth guard + user profile ───────────────────────────────────────────
  async function initPage() {
    try {
      const res = await fetch('/api/me');
      if (res.status === 401) { window.location.href = '/login'; return; }
      const user = await res.json();
      if (user.role !== 'student') { window.location.href = '/login'; return; }

      document.getElementById('user-name').textContent    = `👤 ${user.name}`;
      document.getElementById('user-balance').textContent = `💰 RM${parseFloat(user.acc_balance).toFixed(2)}`;
      document.getElementById('user-bar').style.display   = 'flex';
    } catch {
      window.location.href = '/login';
      return;
    }
    loadBoxes();
  }

  document.getElementById('btn-logout').addEventListener('click', async () => {
    await fetch('/api/logout', { method: 'POST' });
    window.location.href = '/login';
  });

  // ── Modal ───────────────────────────────────────────────────────────────
  function showModal({ success, title, code, msg }) {
    modalBox.classList.toggle('error', !success);
    document.getElementById('modal-icon').textContent  = success ? '🎉' : '⚠️';
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-msg').textContent   = msg;

    const codeWrap = document.getElementById('modal-code-wrap');
    if (code) {
      codeWrap.style.display = 'block';
      document.getElementById('modal-code').textContent = code;
    } else {
      codeWrap.style.display = 'none';
    }
    modal.classList.add('open');
  }

  document.getElementById('modal-close').addEventListener('click', () => {
    modal.classList.remove('open');
  });
  modal.addEventListener('click', e => {
    if (e.target === modal) modal.classList.remove('open');
  });

  // ── Helpers ─────────────────────────────────────────────────────────────
  function starsDisplay(rating) {
    if (rating === null || rating === undefined) return '<span style="color:var(--dim)">NO RATINGS</span>';
    const r    = parseFloat(rating);
    const full = Math.floor(r);
    const half = (r - full) >= 0.5 ? 1 : 0;
    const empty = 5 - full - half;
    return `<span style="color:var(--amber)">${'★'.repeat(full)}${half ? '½' : ''}${'☆'.repeat(empty)}</span>`
         + `<span style="color:var(--dim); font-size:0.28rem; margin-left:5px">${r.toFixed(1)}</span>`;
  }

  function formatTime(t) {
    if (!t) return '—';
    const parts = t.split(':');
    let h = parseInt(parts[0], 10);
    const m = parts[1];
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12 || 12;
    return `${h}:${m} ${ampm}`;
  }

  function buildCard(box) {
    const card = document.createElement('div');
    card.className = 'box-card';
    card.innerHTML = `
      <div class="card-store">${box.storeName}</div>
      <div class="card-name">${box.name}</div>
      <div class="card-prices">
        <span class="price-original">RM${parseFloat(box.originalPrice).toFixed(2)}</span>
        <span class="price-flash">RM${parseFloat(box.flashPrice).toFixed(2)}</span>
      </div>
      <div class="card-meta">
        PICKUP BY: <span>${formatTime(box.pickUpDeadline)}</span><br>
        LOCATION: <span>${box.location}</span><br>
        CATEGORY: <span>${box.category}</span><br>
        RATING: <span>${starsDisplay(box.rating)}</span>
      </div>
      <div class="stock-badge">STOCK: ${box.stockQuantity}</div>
      <button class="btn-reserve" data-box-id="${box.box_ID}" data-flash="${box.flashPrice}">
        [ RESERVE ]
      </button>
    `;
    return card;
  }

  async function loadBoxes() {
    try {
      const res  = await fetch('/api/boxes');
      const data = await res.json();
      statusMsg.style.display = 'none';

      if (!data.length) {
        statusMsg.style.display = 'block';
        statusMsg.innerHTML = '<p>NO BOXES AVAILABLE RIGHT NOW.<br>CHECK BACK LATER!</p>';
        return;
      }

      data.forEach(box => grid.appendChild(buildCard(box)));
    } catch (err) {
      statusMsg.innerHTML = `<p style="color:var(--rose)">CONNECTION ERROR.<br>${err.message}</p>`;
    }
  }

  async function reserveBox(boxId, flashPrice, btn) {
    btn.disabled = true;
    btn.textContent = '[ WAIT... ]';
    try {
      const res  = await fetch('/api/order', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ box_ID: boxId }),
      });

      if (res.status === 401) { window.location.href = '/login'; return; }

      const data = await res.json();

      if (res.ok) {
        showModal({
          success: true,
          title:   'ORDER PLACED!',
          code:    data.pickUpCode,
          msg:     `RM${parseFloat(flashPrice).toFixed(2)} deducted from wallet.\nShow this code at pick-up.`,
        });
        grid.innerHTML = '';
        loadBoxes();
        // Refresh balance display
        fetch('/api/me').then(r => r.json()).then(u => {
          document.getElementById('user-balance').textContent = `💰 RM${parseFloat(u.acc_balance).toFixed(2)}`;
        });
      } else {
        showModal({
          success: false,
          title:   'ORDER FAILED',
          code:    null,
          msg:     data.error || 'Unknown error occurred.',
        });
        btn.disabled = false;
        btn.textContent = '[ RESERVE ]';
      }
    } catch (err) {
      showModal({ success: false, title: 'NETWORK ERROR', code: null, msg: err.message });
      btn.disabled = false;
      btn.textContent = '[ RESERVE ]';
    }
  }

  grid.addEventListener('click', e => {
    const btn = e.target.closest('.btn-reserve');
    if (!btn || btn.disabled) return;
    reserveBox(parseInt(btn.dataset.boxId), btn.dataset.flash, btn);
  });

  // ── Leaderboard ────────────────────────────────────────────────────────
  async function loadLeaderboard() {
    const list = document.getElementById('lb-list');
    try {
      const res   = await fetch('/api/leaderboard');
      const rows  = await res.json();
      list.innerHTML = '';

      if (!rows.length) {
        list.innerHTML = '<li class="lb-empty">NO SCORES YET. START RESCUING!</li>';
        return;
      }

      const medals = ['🥇', '🥈', '🥉'];
      const rankClasses = ['lb-rank-1', 'lb-rank-2', 'lb-rank-3', 'lb-rank-n', 'lb-rank-n'];

      rows.forEach((row, i) => {
        const li = document.createElement('li');
        li.className = 'lb-row';
        li.innerHTML = `
          <span class="lb-rank ${rankClasses[i]}">${medals[i] ?? `#${i + 1}`}</span>
          <span class="lb-name">${row.name}</span>
          <span class="lb-score">${row.eco_points}</span>
        `;
        list.appendChild(li);
      });
    } catch {
      list.innerHTML = '<li class="lb-empty" style="color:var(--rose)">FAILED TO LOAD.</li>';
    }
  }

  initPage();
  loadLeaderboard();
</script>
</body>
</html>
